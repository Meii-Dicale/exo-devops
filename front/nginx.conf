# Configuration Nginx du conteneur "front".
# Rôle : (1) servir le site compilé, (2) transmettre /api et /health à l'API.
# C'est ce "reverse proxy" qui remplace le proxy de Vite utilisé en développement.
#
# Ce fichier est un "template" : ${NGINX_LOCAL_RESOLVERS} est remplacé au démarrage
# du conteneur par l'adresse du serveur DNS du réseau Docker (voir Dockerfile).
# Seules les variables d'environnement connues sont remplacées : $uri, $api_upstream...
# restent des variables Nginx.

# Cache des fichiers de Vite (nom avec hash) : posé ici par un map, et non par un
# add_header dans location /assets/, car add_header N'EST PAS hérité : une location
# qui en a un perd tous ceux du niveau server (CSP comprise). Valeur vide = pas d'en-tête.
map $uri $cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- En-têtes de sécurité (étape 5, voir docs/SECURITE.md) -------------------
    # always : aussi sur les réponses d'erreur (404, 502...).
    # Ne pas annoncer la version de Nginx (Server: nginx au lieu de nginx/1.x.y).
    server_tokens off;

    # CSP : uniquement des ressources du même site. Le build Vite n'a ni script ni
    # style inline (dist/index.html), donc pas de 'unsafe-inline'. Le JS n'appelle que
    # /api (connect-src 'self'). frame-ancestors 'none' : interdit l'affichage en iframe.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # Le navigateur respecte le Content-Type (pas de « devinette » d'un script).
    add_header X-Content-Type-Options "nosniff" always;
    # Anti-clickjacking pour les navigateurs qui ignorent frame-ancestors.
    add_header X-Frame-Options "DENY" always;
    # L'URL complète ne part pas vers les autres sites, seulement l'origine.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Fonctions du navigateur dont l'appli n'a pas besoin : refusées.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Isolation entre origines (le site ne charge que ses propres fichiers).
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cache-Control $cache_control;

    # L'API répond « X-Powered-By: Express » : inutile de l'annoncer au monde.
    proxy_hide_header X-Powered-By;

    # DNS utilisé pour retrouver l'adresse du service "api". valid=10s : on
    # re-demande l'adresse toutes les 10 s. Sans cela, Nginx mémoriserait l'IP de l'API
    # une fois pour toutes : après un redéploiement de l'API (nouveau conteneur, donc
    # parfois nouvelle IP), il enverrait ses requêtes dans le vide -> erreur 502.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

    # Le nom "api" est celui du service dans compose.yaml : le réseau Docker le résout.
    # On le met dans une variable pour que Nginx le résolve à chaque requête
    # (et pas une seule fois au démarrage).
    set $api_upstream http://api:3000;

    # Les appels /api/... partent vers l'API (le chemin est transmis tel quel).
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /health aussi : pratique pour le smoke test et la supervision depuis l'extérieur.
    location = /health {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    # Tout le reste : les fichiers du site. Si le fichier n'existe pas, on renvoie
    # index.html (utile pour les applications à une seule page).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les fichiers générés par Vite ont un nom contenant un hash : ils peuvent être
    # gardés très longtemps en cache (Cache-Control posé par le map, plus haut).
    # Surtout PAS de add_header ici : on perdrait tous les en-têtes de sécurité.
    # Un asset absent renvoie 404 (et non index.html, qui serait servi comme du JS).
    location /assets/ {
        try_files $uri =404;
    }
}
