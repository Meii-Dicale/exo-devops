name: CI

on:
  pull_request:
  push:
    branches: [main]

# Le jeton GITHUB_TOKEN ne peut que lire le dépôt : la CI n'a rien à écrire.
permissions:
  contents: read

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          # Chemin depuis la RACINE du dépôt : setup-node ignore working-directory.
          cache-dependency-path: api/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format (Prettier)
        run: npm run format:check

      - name: Tests unitaires et couverture
        run: npm run test:coverage
